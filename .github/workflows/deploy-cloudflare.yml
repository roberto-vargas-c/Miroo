# Deploys Schema to Cloudflare Workers on every push to main, or by hand from the Actions tab.
# Setup (secrets and variables to add in GitHub) is in README.md, "Deploying to Cloudflare".
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_REALTIME_URL: /realtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN DATABASE_URL; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets or variables:$missing (see README, Deploying to Cloudflare)"; exit 1; fi

      - run: npm ci

      - name: Update the database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Refuses changes that would delete data; those need a manual decision.
        run: npx prisma db push --skip-generate

      - name: Use another Hyperdrive, if one is set
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
        run: |
          [ -z "$HYPERDRIVE_ID" ] || sed -i -E "s/\"id\": \"[0-9a-f]{32}\"/\"id\": \"${HYPERDRIVE_ID}\"/" wrangler.jsonc

      # Videos and other large uploads go to an R2 bucket. The bucket is created on the first deploy;
      # if R2 isn't enabled on the account (or the token can't use it), uploads stay in Postgres (25 MB max).
      - name: Set up video storage (R2)
        run: |
          if npx wrangler r2 bucket info schema-media >/dev/null 2>&1 || npx wrangler r2 bucket create schema-media; then
            node -e '
              const fs = require("fs");
              const s = fs.readFileSync("wrangler.jsonc", "utf8");
              fs.writeFileSync("wrangler.jsonc", s.replace(/"send_email":/, "\"r2_buckets\": [{ \"binding\": \"MEDIA\", \"bucket_name\": \"schema-media\" }],\n  \"send_email\":"));
            '
            grep -q '"MEDIA"' wrangler.jsonc && echo "R2 bucket schema-media bound as MEDIA"
          else
            echo "::warning::Couldn't use R2 (enable R2 in the Cloudflare dashboard and give the API token R2 edit access). Videos are limited to 25 MB until then."
          fi

      - name: Build
        run: npm run cf:build

      - name: Deploy
        env:
          APP_URL: ${{ vars.APP_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MIRO_CLIENT_ID: ${{ secrets.MIRO_CLIENT_ID }}
          MIRO_CLIENT_SECRET: ${{ secrets.MIRO_CLIENT_SECRET }}
        # Secrets go up with the new version, so it never runs without them. Only the ones that are
        # set are sent, through a JSON file rather than the command line. Without an AUTH_SECRET
        # secret, the first deploy generates a random one on the Worker and later deploys keep it.
        run: |
          has_auth=$(npx wrangler secret list --format json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).some(x=>x.name==="AUTH_SECRET")?1:0)}catch{console.log(0)}})')
          node -e '
            const keys = ["AUTH_SECRET","ANTHROPIC_API_KEY","RESEND_API_KEY","EMAIL_FROM","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","MIRO_CLIENT_ID","MIRO_CLIENT_SECRET"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            if (!out.AUTH_SECRET && process.argv[1] !== "1") out.AUTH_SECRET = require("crypto").randomBytes(32).toString("base64url");
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(out));
          ' "$has_auth"
          args=(--secrets-file "$RUNNER_TEMP/worker-secrets.json")
          [ -n "$APP_URL" ] && args+=(--var "APP_URL:$APP_URL")
          npx wrangler deploy "${args[@]}"
          rm "$RUNNER_TEMP/worker-secrets.json"
